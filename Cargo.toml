[package]
name = "tauri-plugin-google-native-auth"
version = "0.1.0"
authors = [ "2vil" ]
description = "Native Google Sign-In for Tauri Android using Credential Manager API"
edition = "2021"
rust-version = "1.77.2"
exclude = ["/examples", "/node_modules"]
links = "tauri-plugin-google-native-auth"

[dependencies]
tauri = { version = "2.8.5" }
serde = "1.0"
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2.4.0", features = ["build"] }
